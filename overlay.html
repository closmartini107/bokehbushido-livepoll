<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BokehBushido — Poll Overlay</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap');

:root {
  --bg:    #080810;
  --panel: rgba(12,12,22,0.97);
  --border:rgba(232,184,75,0.18);
  --gold:  #e8b84b;
  --a: #ff4466; --b: #3db8ff; --c: #3dffa0; --d: #ffd84b;
  --text: #eeeeff; --muted: #7777aa;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  overflow: hidden;
}

/* Animated bokeh background — thematic for @bokehbushido! */
.bokeh-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}

.bokeh-bg::before, .bokeh-bg::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: .18;
  animation: drift 12s ease-in-out infinite alternate;
}
.bokeh-bg::before {
  width: 600px; height: 600px;
  background: radial-gradient(circle, var(--gold), transparent 70%);
  top: -100px; left: -100px;
}
.bokeh-bg::after {
  width: 500px; height: 500px;
  background: radial-gradient(circle, #3db8ff, transparent 70%);
  bottom: -80px; right: -80px;
  animation-delay: -6s;
}

@keyframes drift {
  from { transform: translate(0,0) scale(1); }
  to   { transform: translate(60px,40px) scale(1.15); }
}

.bokeh-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(60px);
  opacity: .12;
  pointer-events: none;
  animation: drift2 16s ease-in-out infinite alternate;
}
@keyframes drift2 {
  from { transform: translate(0,0); }
  to   { transform: translate(-40px,60px); }
}

/* Grid lines */
.grid {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-image:
    linear-gradient(rgba(232,184,75,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,184,75,.04) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}

/* Main layout */
.stage {
  position: relative;
  z-index: 1;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 60px;
}

/* Waiting state */
.waiting {
  text-align: center;
}
.waiting-title {
  font-family: 'Bebas Neue', cursive;
  font-size: 3.5rem;
  letter-spacing: 6px;
  color: var(--gold);
  opacity: .3;
  margin-bottom: 12px;
}
.waiting-sub {
  color: var(--muted);
  font-size: 1rem;
  letter-spacing: 2px;
}

/* Poll card */
.poll-card {
  width: 100%; max-width: 1100px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 52px 60px;
  box-shadow: 0 0 80px rgba(232,184,75,.08), 0 0 0 1px rgba(255,255,255,.04);
  display: none;
  animation: cardIn .6s cubic-bezier(.22,1,.36,1) both;
}
@keyframes cardIn {
  from { opacity:0; transform: translateY(30px) scale(.97); }
  to   { opacity:1; transform: none; }
}

/* Header row */
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 32px;
}
.brand {
  font-family: 'Bebas Neue', cursive;
  font-size: 1.1rem;
  letter-spacing: 4px;
  color: var(--gold);
  opacity: .7;
}
.live-chip {
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,68,102,.1);
  border: 1px solid rgba(255,68,102,.3);
  border-radius: 20px;
  padding: 6px 16px;
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: 2px;
  color: #ff4466;
  text-transform: uppercase;
}
.live-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #ff4466;
  box-shadow: 0 0 6px #ff4466;
  animation: blink 1.2s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1}50%{opacity:.2} }

/* Question */
.question {
  font-family: 'Bebas Neue', cursive;
  font-size: clamp(2rem, 4vw, 3.4rem);
  letter-spacing: 2px;
  line-height: 1.15;
  margin-bottom: 40px;
  color: var(--text);
}

/* Bar options */
.options { display: flex; flex-direction: column; gap: 18px; margin-bottom: 36px; }

.opt {
  display: grid;
  grid-template-columns: 46px 1fr 80px;
  align-items: center;
  gap: 16px;
}
.opt-badge {
  width: 46px; height: 46px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', cursive;
  font-size: 1.5rem;
  letter-spacing: 1px;
  flex-shrink: 0;
}
.opt-badge-a { background: rgba(255,68,102,.15); color:var(--a); border:1px solid rgba(255,68,102,.3); }
.opt-badge-b { background: rgba(61,184,255,.15); color:var(--b); border:1px solid rgba(61,184,255,.3); }
.opt-badge-c { background: rgba(61,255,160,.15); color:var(--c); border:1px solid rgba(61,255,160,.3); }
.opt-badge-d { background: rgba(255,216,75,.15); color:var(--d); border:1px solid rgba(255,216,75,.3); }

.opt-bar-wrap { flex: 1; }
.opt-text {
  font-size: 1.05rem;
  font-weight: 600;
  margin-bottom: 7px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.winner-crown { animation: bob .8s ease-in-out infinite; }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }

.track {
  width: 100%; height: 14px;
  background: rgba(255,255,255,.05);
  border-radius: 7px;
  overflow: hidden;
}
.fill {
  height: 100%; border-radius: 7px; width: 0%;
  transition: width .7s cubic-bezier(.34,1.56,.64,1);
  position: relative;
}
.fill::after {
  content:'';
  position:absolute;
  right:0;top:0;bottom:0;
  width:24px;
  background:rgba(255,255,255,.25);
  border-radius:7px;
  filter:blur(5px);
}
.fill-a { background: linear-gradient(90deg,rgba(255,68,102,.5),var(--a)); box-shadow:0 0 12px rgba(255,68,102,.4); }
.fill-b { background: linear-gradient(90deg,rgba(61,184,255,.5),var(--b)); box-shadow:0 0 12px rgba(61,184,255,.4); }
.fill-c { background: linear-gradient(90deg,rgba(61,255,160,.5),var(--c)); box-shadow:0 0 12px rgba(61,255,160,.4); }
.fill-d { background: linear-gradient(90deg,rgba(255,216,75,.5),var(--d)); box-shadow:0 0 12px rgba(255,216,75,.4); }

.opt-pct {
  font-family: 'Bebas Neue', cursive;
  font-size: 2.2rem;
  letter-spacing: 1px;
  text-align: right;
  line-height: 1;
}
.pct-a{color:var(--a)} .pct-b{color:var(--b)} .pct-c{color:var(--c)} .pct-d{color:var(--d)}

/* Footer */
.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 22px;
  border-top: 1px solid rgba(255,255,255,.07);
}
.total-votes {
  font-size: .85rem;
  color: var(--muted);
  letter-spacing: 1px;
}
.total-votes strong { color: var(--text); font-size: 1.1rem; }

.cta {
  font-size: .9rem;
  color: var(--muted);
  letter-spacing: 1.5px;
}
.cta strong { color: var(--gold); }

.closed-banner {
  background: rgba(61,255,160,.06);
  border: 1px solid rgba(61,255,160,.2);
  border-radius: 8px;
  padding: 8px 18px;
  font-size: .8rem;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--c);
  text-transform: uppercase;
  display: none;
}
</style>
</head>
<body>

<!-- Bokeh atmosphere (thematic!) -->
<div class="bokeh-bg"></div>
<div class="bokeh-orb" style="width:400px;height:400px;background:radial-gradient(circle,#ff4466,transparent 70%);top:10%;right:15%"></div>
<div class="bokeh-orb" style="width:300px;height:300px;background:radial-gradient(circle,#3dffa0,transparent 70%);bottom:20%;left:10%;animation-delay:-8s"></div>
<div class="grid"></div>

<div class="stage">

  <!-- Waiting -->
  <div class="waiting" id="waiting">
    <div class="waiting-title">BOKEH BUSHIDO</div>
    <div class="waiting-sub">POLL OVERLAY • STANDING BY</div>
  </div>

  <!-- Poll card -->
  <div class="poll-card" id="pollCard">
    <div class="card-header">
      <div class="brand">BOKEH BUSHIDO</div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div class="closed-banner" id="closedBanner">🔒 Voting Closed</div>
        <div class="live-chip" id="liveChip"><div class="live-dot"></div> LIVE POLL</div>
      </div>
    </div>

    <div class="question" id="question"></div>
    <div class="options" id="options"></div>

    <div class="card-footer">
      <div class="total-votes">Total votes: <strong id="totalVotes">0</strong></div>
      <div class="cta" id="cta">Type <strong>A · B · C · D</strong> in chat to vote!</div>
    </div>
  </div>

</div>

<!-- CONFIGURATION -->
<script>
// ↓↓ PASTE YOUR APPS SCRIPT WEB APP URL HERE ↓↓
const SCRIPT_URL = 'PASTE_YOUR_APPS_SCRIPT_URL_HERE';
// ↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑↑

const POLL_INTERVAL = 4000; // ms between refreshes
const OPTS = ['a','b','c','d'];

let lastState = null;

async function fetchState() {
  if (!SCRIPT_URL || SCRIPT_URL.includes('PASTE')) return;
  try {
    const res  = await fetch(`${SCRIPT_URL}?action=getState`);
    const data = await res.json();
    render(data);
    lastState = data;
  } catch(e) {}
}

function render(s) {
  const waiting  = document.getElementById('waiting');
  const card     = document.getElementById('pollCard');

  if (!s.active) {
    waiting.style.display = 'block';
    card.style.display    = 'none';
    return;
  }

  waiting.style.display = 'none';
  card.style.display    = 'block';

  document.getElementById('question').textContent = s.question;

  const closed = !s.open;
  document.getElementById('closedBanner').style.display = closed ? 'block' : 'none';
  document.getElementById('liveChip').style.display     = closed ? 'none'  : 'flex';
  document.getElementById('cta').innerHTML              = closed
    ? '👑 Final Results'
    : 'Type <strong>A · B · C · D</strong> in chat to vote!';

  const filledOpts = OPTS.filter(l => s.options[l]);
  const total      = filledOpts.reduce((sum,l) => sum + (s.votes[l]||0), 0);
  const maxV       = Math.max(...filledOpts.map(l => s.votes[l]||0));

  document.getElementById('totalVotes').textContent = total;

  const container = document.getElementById('options');
  container.innerHTML = filledOpts.map(l => {
    const pct    = total > 0 ? Math.round(((s.votes[l]||0)/total)*100) : 0;
    const winner = closed && (s.votes[l]||0) === maxV && maxV > 0;
    return `
      <div class="opt">
        <div class="opt-badge opt-badge-${l}">${l.toUpperCase()}</div>
        <div class="opt-bar-wrap">
          <div class="opt-text">${s.options[l]}${winner?' <span class="winner-crown">👑</span>':''}</div>
          <div class="track"><div class="fill fill-${l}" id="fill-${l}"></div></div>
        </div>
        <div class="opt-pct pct-${l}">${pct}%</div>
      </div>`;
  }).join('');

  // Animate bars after DOM paint
  setTimeout(() => {
    filledOpts.forEach(l => {
      const pct = total > 0 ? Math.round(((s.votes[l]||0)/total)*100) : 0;
      const el  = document.getElementById(`fill-${l}`);
      if (el) el.style.width = pct + '%';
    });
  }, 60);
}

// Start polling
setInterval(fetchState, POLL_INTERVAL);
fetchState();
</script>
</body>
</html>
